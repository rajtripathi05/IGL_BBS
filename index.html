<script>
  /* stamp the saved theme before first paint so there is no flash */
  try {
    var t = JSON.parse(localStorage.getItem('iglbbs.settings') || '{}');
    document.documentElement.setAttribute('data-theme', t.theme === 'light' ? 'light' : 'dark');
    if (t.density) document.documentElement.setAttribute('data-density', t.density);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
